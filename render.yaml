services:
  - type: web
    name: confessionflow
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://confession-5ha2.onrender.com
      - key: RENDER_EXTERNAL_URL
        value: https://confession-5ha2.onrender.com
      - key: MOCK_EXTERNAL_APIS
        value: "false"

      # Google Sheets
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        value: 1S5HcRCh27paVdqyiCAqAI_1x-LCABtb73R6Fisn-QJs
      - key: GOOGLE_SHEETS_SHEET_NAME
        value: Confessions
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false

      # AI
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false

      # Instagram
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false

      # Publishing
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: MAX_DAILY_POSTS
        value: "15"
      - key: AUTO_PUBLISH_ENABLED
        value: "true"
      - key: BRAND_NAME
        value: Campus Confessions
      - key: INSTAGRAM_HANDLE
        value: "@_hpsconfession_"

      # Security
      - key: CRON_SECRET
        generateValue: true

      # Supabase (placeholder — not used yet)
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://placeholder-project.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: placeholder-anon-key
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: placeholder-service-role-key
