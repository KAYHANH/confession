name: ConfessionFlow Auto-Publish Cron & Keep-Alive

on:
  schedule:
    # Run every 10 minutes to stay within Render's 15-minute sleep threshold
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger anytime from GitHub UI

jobs:
  ping-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive & Auto-Publish Endpoints
        run: |
          echo "Pinging health keep-alive to prevent Render sleep..."
          curl -s "https://confession-4nbc.onrender.com/api/health" || true
          echo ""
          echo "Pinging ConfessionFlow auto-publish endpoint..."
          curl -s -X POST "https://confession-4nbc.onrender.com/api/cron/auto-publish" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{}' || true
          echo ""
          echo "Pinging Google Sheets sync endpoint..."
          curl -s -X POST "https://confession-4nbc.onrender.com/api/cron/sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{}' || true
